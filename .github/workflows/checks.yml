name: Current implementation checks
on: [push, pull_request]
jobs:
  pure-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check beyond_ui tests tools examples
      - run: uv run python -m unittest discover -s tests
      - run: uv run python tools/check_custom_parity.py
      - run: uv run python tools/generate_coverage.py
      - run: git diff --exit-code -- docs/COVERAGE.md
